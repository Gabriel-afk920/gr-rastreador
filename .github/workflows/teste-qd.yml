name: Teste Querido Diário (temporário)

on:
  workflow_dispatch:

jobs:
  teste:
    runs-on: ubuntu-latest
    steps:
      - name: Testar API Querido Diário — Belém
        run: |
          echo "=== robots.txt ==="
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://api.queridodiario.org.br/robots.txt")
          echo "robots.txt HTTP $STATUS"

          echo "=== health ==="
          curl -s "https://api.queridodiario.org.br/health"
          echo ""

          echo "=== busca concurso público em Belém (1501402) ==="
          RESP=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            "https://api.queridodiario.org.br/gazettes?territory_ids=1501402&querystring=concurso+p%C3%BAblico&sort_by=descending_date&size=2&excerpt_size=200&number_of_excerpts=1" \
            -H "User-Agent: GrNoticias-Bot/1.0 (+https://github.com/Gabriel-afk920/gr-rastreador)")
          HTTP=$(echo "$RESP" | grep "HTTP_STATUS:" | cut -d: -f2)
          BODY=$(echo "$RESP" | grep -v "HTTP_STATUS:")
          echo "HTTP $HTTP"
          echo "$BODY" | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          print(f'total_gazettes: {d[\"total_gazettes\"]}')
          for g in d['gazettes']:
              print(f'  data={g[\"date\"]} territorio={g[\"territory_id\"]} pdf={g[\"url\"][:60]}...')
              if g['excerpts']:
                  print(f'  trecho: {g[\"excerpts\"][0][:150]}')
          "

          echo "=== busca concurso público — Pará sem filtro de cidade ==="
          RESP2=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            "https://api.queridodiario.org.br/gazettes?querystring=concurso+p%C3%BAblico&sort_by=descending_date&size=3" \
            -H "User-Agent: GrNoticias-Bot/1.0 (+https://github.com/Gabriel-afk920/gr-rastreador)")
          HTTP2=$(echo "$RESP2" | grep "HTTP_STATUS:" | cut -d: -f2)
          BODY2=$(echo "$RESP2" | grep -v "HTTP_STATUS:")
          echo "HTTP $HTTP2"
          echo "$BODY2" | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          print(f'total_gazettes: {d[\"total_gazettes\"]}')
          pa = [g for g in d['gazettes'] if g.get('state_code') == 'PA']
          print(f'  resultados PA nesta pagina: {len(pa)}')
          for g in d['gazettes'][:3]:
              print(f'  {g[\"date\"]} {g.get(\"territory_name\",\"?\")} {g.get(\"state_code\",\"?\")}')
          "
