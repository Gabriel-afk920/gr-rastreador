name: Teste Fontes DOU/IOEPA (temporário)

on:
  workflow_dispatch:

jobs:
  teste:
    runs-on: ubuntu-latest
    steps:
      - name: Testar fontes
        run: |
          set +e

          echo "=== 1. in.gov.br robots.txt ==="
          STATUS=$(curl -s -o /tmp/robots_in.txt -w "%{http_code}" --max-time 15 \
            -A "GrNoticias-Bot/1.0 (+https://github.com/Gabriel-afk920/gr-rastreador)" \
            "https://www.in.gov.br/robots.txt" 2>&1)
          echo "HTTP $STATUS"
          if [ "$STATUS" = "200" ]; then cat /tmp/robots_in.txt | head -5; fi

          echo ""
          echo "=== 2. in.gov.br busca DOU Seção 3 ==="
          STATUS2=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 \
            -A "GrNoticias-Bot/1.0 (+https://github.com/Gabriel-afk920/gr-rastreador)" \
            "https://www.in.gov.br/leiturajornal?data=21-10-2026&secao=do3" 2>&1)
          echo "HTTP $STATUS2"

          echo ""
          echo "=== 3. IOEPA robots.txt ==="
          STATUS3=$(curl -s -o /tmp/robots_ioepa.txt -w "%{http_code}" --max-time 15 \
            -A "GrNoticias-Bot/1.0 (+https://github.com/Gabriel-afk920/gr-rastreador)" \
            "https://www.ioepa.com.br/robots.txt" 2>&1)
          echo "HTTP $STATUS3"
          grep -i "disallow\|allow:" /tmp/robots_ioepa.txt 2>/dev/null || echo "(sem regras Disallow/Allow)"

          echo ""
          echo "=== 4. IOEPA edição de hoje ==="
          STATUS4=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 \
            -A "GrNoticias-Bot/1.0 (+https://github.com/Gabriel-afk920/gr-rastreador)" \
            "https://www.ioepa.com.br/pages/2026/2026.10.21.DOE.pdf" 2>&1)
          echo "HTTP $STATUS4 — https://www.ioepa.com.br/pages/2026/2026.10.21.DOE.pdf"

          echo ""
          echo "=== 5. IOEPA listagem do ano ==="
          STATUS5=$(curl -s -o /tmp/ioepa_2026.html -w "%{http_code}" --max-time 15 \
            -A "GrNoticias-Bot/1.0 (+https://github.com/Gabriel-afk920/gr-rastreador)" \
            "https://www.ioepa.com.br/pages/2026/" 2>&1)
          echo "HTTP $STATUS5"
          grep -o '[0-9]\{4\}\.[0-9]\{2\}\.[0-9]\{2\}\.DOE\.pdf' /tmp/ioepa_2026.html 2>/dev/null | sort | tail -5
